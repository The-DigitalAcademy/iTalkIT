<!-- Overlay backdrop -->
<div class="modal-overlay" (click)="closeModal()"></div>

<!-- Modal Container -->
<div class="modal-container">
  <div class="modal-card">
    <!-- Header -->
    <div class="modal-header">
      <h2 class="modal-title">Create New Post</h2>
      <button type="button" class="close-btn" (click)="closeModal()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form id="postForm" (ngSubmit)="onSubmit()" #postForm="ngForm">
      <!-- Images Section -->
      <div class="form-section">
        <label class="section-label">Images</label>
        
        <!-- Image Upload Area -->
        <div class="upload-area" *ngIf="!imagePreview">
          <label for="imageUpload" class="upload-box">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            <span class="upload-text">Add Image</span>
            <input
              type="file"
              id="imageUpload"
              accept="image/*"
              (change)="onFileSelected($event)"
              required
            />
          </label>
        </div>

        <!-- Image Preview -->
        <div *ngIf="imagePreview" class="preview-box">
          <img [src]="imagePreview" alt="Image preview" />
          <button type="button" class="remove-btn" (click)="removeImage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Caption Section -->
      <div class="form-section">
        <label for="caption" class="section-label">Caption</label>
        <textarea
          id="caption"
          name="caption"
          [(ngModel)]="caption"
          rows="4"
          placeholder="Write a caption..."
          maxlength="500"
          required
        ></textarea>
        <div class="char-count">{{ caption?.length || 0 }}/500</div>
      </div>

      <!-- Action Buttons -->
      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="closeModal()">
          Cancel
        </button>
        <button type="submit" class="btn-post" [disabled]="!imagePreview || !caption">
          Post
        </button>
      </div>
    </form>
  </div>
</div>
