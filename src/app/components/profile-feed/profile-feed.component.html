<div class="profile-page">

  <!-- Profile Header -->
  <div class="profile-header">
    <img [src]="user.profileImage" class="avatar" />

    <div class="profile-info">
      <div class="username-row">
        <h2>{{ user.username }}</h2>
        <button class="edit-btn" (click)="editProfile()">Edit Profile</button>
      </div>

      <div class="stats">
        <span><strong>{{ postCount }}</strong> posts</span>
        <span><strong>{{ user.followers }}</strong> followers</span>
        <span><strong>{{ user.following }}</strong> following</span>
      </div>

      <p class="name">{{ user.name }}</p>
    </div>
  </div>

  <!-- Divider -->
  <hr />

  <!-- Posts -->
  <div class="posts-section">
    <div class="post-card" *ngFor="let post of posts">

      <div *ngIf="!post.editing">
        <p>{{ post.text }}</p>
      </div>

      <textarea *ngIf="post.editing" [(ngModel)]="post.text"></textarea>

      <img *ngIf="post.image" [src]="post.image" />

      <small>
        Posted {{ post.createdAt | date:'medium' }}
      </small>

      <div class="post-actions">
        <button *ngIf="!post.editing" (click)="editPost(post)">Edit</button>
        <button *ngIf="post.editing" (click)="savePost(post)">Save</button>
        <button (click)="deletePost(post.id)">Delete</button>
      </div>

    </div>
  </div>

</div>
