<div class ="register-container">
    <div class="login-card">
        <div class="login-header">
            <h2 align="center">Create an Account</h2>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" formControlName="fullName" placeholder="Enter your full name">  
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" formControlName="email" placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" formControlName="password" placeholder="Create a password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" formControlName="confirmPassword" placeholder="Confirm your password">
                <small class="alert alert-danger" *ngIf="registerForm.errors?.['passwordMismatch']">
                    Passwords do not match
                </small>
            </div>

            <div class="alert alert-danger" *ngIf="error$ | async as error">
                {{ error }}
            </div>

            <button
                class="btn btn-primary btn-block"
                type="submit"
                [disabled]="registerForm.invalid || (loading$ | async)">
            <span *ngIf="!(loading$ | async)">Register</span>
            <span *ngIf="loading$ | async">Creating account...</span>
            </button>

            <div class="register-link">
                <p>Already have an account? <a href="http://localhost:4200/login"><span>Login here</span></a></p>
            </div>
        </form>
    </div>
</div>
