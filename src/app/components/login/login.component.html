<div class="login-container">
  <div class="login-card">
    <div class="login-header">
     <img src="assets/images/trans.jpg" alt="App Logo" class="logo"> 
      <h2>Welcome Back</h2>
      <p>Please login to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <!-- Username/Email Field -->
      <div class="form-group">
        <label for="username">Email Address</label>
        <input 
          type="email" 
          id="username" 
          formControlName="username"
          placeholder="Enter your email"
          [class.is-invalid]="username?.invalid && (username?.touched || username?.dirty)"
          [class.is-valid]="username?.valid && (username?.touched || username?.dirty)"
        >
        <div class="invalid-feedback" *ngIf="username?.invalid && (username?.touched || username?.dirty)">
          <span *ngIf="username?.errors?.['required']">Email is required</span>
          <span *ngIf="username?.errors?.['email']">Please enter a valid email address</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password"
          placeholder="Enter your password"
          [class.is-invalid]="password?.invalid && (password?.touched || password?.dirty)"
          [class.is-valid]="password?.valid && (password?.touched || password?.dirty)"
        >
        <div class="invalid-feedback" *ngIf="password?.invalid && (password?.touched || password?.dirty)">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <div class="remember-me">
          <input type="checkbox" id="rememberMe" formControlName="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <!-- Error Message -->
      <div class="alert alert-danger" *ngIf="error" role="alert">
        {{ error }}
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="btn btn-primary btn-block"
        [disabled]="loginForm.invalid || loading"
      >
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">
          <i class="spinner-border spinner-border-sm"></i> Logging in...
        </span>
      </button>

      <!-- Register Link -->
      <div class="register-link">
        <p>Don't have an account? <a href="http://localhost:4200/register">Register here</a></p>
      </div>
    </form>
  </div>
</div>
